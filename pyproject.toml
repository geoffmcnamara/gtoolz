[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gtoolz"
version = "0.1.6a0"
dependencies = [
    "docopt",
    # (include any other dependencies your project requires)
]

[tool.setuptools]
py-modules = ["gtoolz"]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "$version"
version = "0.1.6"
version_scheme = "pep440"
version_provider = "commitizen"
version_files = [
    "gtoolz.py:VERSION"
]
update_changelog_on_bump = true
major_version_zero = true
